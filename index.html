<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moving Images</title>
<meta name="description" content="Upload a video and draw it as a trail of frames with your cursor. A Maybe Machine by Ravi Popat.">
<link rel="canonical" href="https://dinefining.github.io/moving-images/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Moving Images">
<meta property="og:title" content="Moving Images">
<meta property="og:description" content="Upload a video and draw it as a trail of frames with your cursor.">
<meta property="og:url" content="https://dinefining.github.io/moving-images/">
<meta property="og:image" content="https://dinefining.github.io/moving-images/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A looping trail of video frames of a runner, drawn across a white page.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Moving Images">
<meta name="twitter:description" content="Upload a video and draw it as a trail of frames with your cursor.">
<meta name="twitter:image" content="https://dinefining.github.io/moving-images/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<button id="menuBtn" class="corner tl" aria-expanded="false" aria-controls="menu" aria-label="Menu">
  <span class="word">ME<br>NU</span>
  <svg class="x" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 8 32 32M32 8 8 32"/></svg>
</button>

<div id="menu" class="sheet tl" hidden>
  <label class="ctl sq" id="upload">
    <i class="fill"></i><span>Upload</span>
    <input id="file" type="file" accept="video/*">
  </label>
  <div class="ctl slider pill" data-key="size"    data-label="Size"       data-min="60" data-max="700" data-value="270"></div>
  <div class="ctl slider sq"   data-key="spacing" data-label="Spacing"    data-min="4"  data-max="300" data-value="60"></div>
  <div class="ctl slider pill" data-key="trail"   data-label="Trail"      data-min="1"  data-max="301" data-value="40"></div>
  <div class="ctl slider sq"   data-key="tilt"    data-label="Tilt"       data-min="0"  data-max="100" data-value="45"></div>
  <div class="ctl slider pill" data-key="step"    data-label="Frame step" data-min="1"  data-max="10"  data-value="1"></div>
  <div class="trio">
    <button class="ctl sq toggle on" data-key="fade" aria-pressed="true"><span>Fade</span></button>
    <button class="ctl pill toggle" data-key="shrink" aria-pressed="false"><span>Retract</span></button>
    <button class="ctl sq toggle" data-key="scale" aria-pressed="false"><span>Scale</span></button>
  </div>
  <div class="trio">
    <button class="ctl pill" id="clear"><span>Clear</span></button>
    <button class="ctl sq" id="save"><span>PNG</span></button>
    <button class="ctl pill" id="record"><span>Record</span></button>
  </div>
</div>

<div id="info" class="sheet br" hidden>
  <p>Moving Images is a tool that lets you draw a trail of separated frames from a video.</p>
  <p>A <a href="https://ravipopat.info/maybe-machines" target="_blank" rel="noopener">Maybe Machine</a> by <a href="https://ravipopat.info" target="_blank" rel="noopener">Ravi Popat</a>.</p>
</div>

<button id="infoBtn" class="corner br" aria-expanded="false" aria-controls="info" aria-label="Info">
  <span class="word">IN<br>FO</span>
  <svg class="x" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 8 32 32M32 8 8 32"/></svg>
</button>

<div id="drop" hidden></div>
<div id="dot" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script src="app.js"></script>
</body>
</html>
